name: Booth Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Dependencies
        run: |
          if [ -f go.mod ]; then
            go mod tidy
          fi

      - name: Run Scraper
        env:
          # ここを確認！全て同じ列に並んでいる必要があります
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_CONFIG_JSON: ${{ secrets.SITE_CONFIG_JSON }}
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_BASE_TEXT: ${{ secrets.PROMPT_BASE_TEXT }}
        run: go run main.go

      - name: Commit and Push State
        run: |
          git config user.name "Scraper Bot"
          git config user.email "bot@example.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update state [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi